name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.13.5"
      - run: uv sync --locked --all-groups --python 3.13
      - run: uv run ruff check .
      - run: uv run ty check .
      - run: uv run pytest
      - run: uv run python -m evals.clone_eval
      - run: uv run python -m evals.normalization_eval
      - run: uv run vulture
